server {
    listen 80;
    server_name _;

    # Same-origin proxy to the backend, mirroring what vite.config.ts's dev
    # server does for `npm run dev` - the backend sends no CORS headers, so
    # the built static app needs this to call the API without the browser
    # blocking it as cross-origin.
    location /api/v1/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # react-router uses client-side routing (BrowserRouter), so a direct
        # request to e.g. /portals/5 must still serve index.html.
        try_files $uri $uri/ /index.html;
    }
}
